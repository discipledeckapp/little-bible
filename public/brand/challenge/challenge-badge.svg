<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#134E4A"/>
      <stop offset="50%"  stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="badge-inner" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="400" cy="400" r="395" fill="url(#badge-bg)"/>
  <!-- Outer gold border -->
  <circle cx="400" cy="400" r="388" fill="none" stroke="#FCD34D" stroke-width="10" opacity="0.7"/>
  <!-- Star points on outer ring -->
  <circle cx="400" cy="20"  r="14" fill="#FCD34D" opacity="0.9"/>
  <circle cx="562" cy="62"  r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="724" cy="182" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="782" cy="360" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="724" cy="618" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="562" cy="738" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="400" cy="780" r="14" fill="#FCD34D" opacity="0.9"/>
  <circle cx="238" cy="738" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="76"  cy="618" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="18"  cy="360" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="76"  cy="182" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="238" cy="62"  r="10" fill="#FCD34D" opacity="0.7"/>

  <!-- Inner circle -->
  <circle cx="400" cy="400" r="320" fill="#0C3D38"/>
  <circle cx="400" cy="400" r="312" fill="none" stroke="#FDE68A" stroke-width="4" opacity="0.4"/>

  <!-- Large Lumi celebrating — centred -->
  <svg x="120" y="80" width="560" height="560" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="45" rx="38" ry="36" fill="#FCD34D" opacity="0.28"/>
    <!-- Confetti -->
    <rect x="8"  y="4"  width="4"   height="7"   rx="1.5" fill="#F87171" opacity="0.9" transform="rotate(-20 10 8)"/>
    <rect x="64" y="6"  width="4"   height="7"   rx="1.5" fill="#60A5FA" opacity="0.9" transform="rotate(15 66 10)"/>
    <rect x="14" y="18" width="3.5" height="6"   rx="1"   fill="#A78BFA" opacity="0.85" transform="rotate(40 16 21)"/>
    <rect x="58" y="2"  width="3.5" height="6"   rx="1"   fill="#34D399" opacity="0.85" transform="rotate(-10 60 5)"/>
    <rect x="2"  y="30" width="3"   height="5"   rx="1"   fill="#FCD34D" opacity="0.85" transform="rotate(30 4 33)"/>
    <rect x="70" y="20" width="3"   height="5"   rx="1"   fill="#F87171" opacity="0.8" transform="rotate(-35 72 23)"/>
    <!-- Body -->
    <ellipse cx="40" cy="50" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="43" rx="20" ry="16" fill="#F59E0B"/>
    <!-- Leaf extra perky -->
    <path d="M40 22 Q26 8 31 -2 Q47 2 40 22Z" fill="#34D399"/>
    <!-- Celebrating eyes -->
    <path d="M30 44 Q33.5 40 37 44" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M43 44 Q46.5 40 50 44" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Huge smile -->
    <path d="M30 53 Q40 65 50 53" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Extra sparkles -->
    <circle cx="18" cy="36" r="3"   fill="#FEF3C7" opacity="0.95"/>
    <circle cx="62" cy="32" r="2.4" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="12" cy="52" r="2"   fill="#FEF3C7" opacity="0.8"/>
    <circle cx="68" cy="50" r="1.8" fill="#FEF3C7" opacity="0.75"/>
  </svg>

  <!-- Badge text -->
  <text x="400" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#FDE68A" letter-spacing="1">#LittleBibleChallenge</text>
  <text x="400" y="696" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="white">7 Days Complete</text>
  <text x="400" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" fill="#6EE7B7" opacity="0.75">littlebible.org/challenge</text>
</svg>
