  <rect x="30" y="30" width="782" height="1130" rx="6" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner cross motifs -->
  <!-- Top-left -->
  <rect x="44"  y="44"  width="1.5" height="24" rx="0.75" fill="#B45309" opacity="0.5"/>
  <rect x="38"  y="56"  width="13.5" height="1.5" rx="0.75" fill="#B45309" opacity="0.5"/>
  <!-- Top-right -->
  <rect x="796.5" y="44" width="1.5" height="24" rx="0.75" fill="#B45309" opacity="0.5"/>
  <rect x="790.5" y="56" width="13.5" height="1.5" rx="0.75" fill="#B45309" opacity="0.5"/>
  <!-- Bottom-left -->
  <rect x="44"  y="1122" width="1.5" height="24" rx="0.75" fill="#B45309" opacity="0.5"/>
  <rect x="38"  y="1134" width="13.5" height="1.5" rx="0.75" fill="#B45309" opacity="0.5"/>
  <!-- Bottom-right -->
  <rect x="796.5" y="1122" width="1.5" height="24" rx="0.75" fill="#B45309" opacity="0.5"/>
  <rect x="790.5" y="1134" width="13.5" height="1.5" rx="0.75" fill="#B45309" opacity="0.5"/>

  <!-- Header: Logo -->
  <svg x="371" y="60" width="100" height="100" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="cert-icon" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#7C2D12"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="9" fill="url(#cert-icon)"/>
    <rect x="17.25" y="3" width="1.5" height="10" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <rect x="13" y="6.5" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <path d="M7 14.5 L17 13.5 L17 28 L7 27 Q6 27 6 26 L6 15.5 Q6 14.5 7 14.5Z" fill="rgba(255,255,255,0.96)"/>
    <path d="M29 14.5 L19 13.5 L19 28 L29 27 Q30 27 30 26 L30 15.5 Q30 14.5 29 14.5Z" fill="rgba(255,255,255,0.76)"/>
    <rect x="17" y="13.5" width="2" height="14.5" fill="rgba(120,53,15,0.22)"/>
    <rect x="8" y="16.5" width="7" height="1.2" rx="0.6" fill="rgba(120,53,15,0.28)"/>
    <rect x="8" y="19.5" width="8" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="16.5" width="6.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="19.5" width="7.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.15)"/>
  </svg>
  <text x="421" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#78350F" opacity="0.8">Little Bible</text>

  <!-- Decorative line -->
  <rect x="121" y="206" width="600" height="2" rx="1" fill="#FDE68A" opacity="0.55"/>

  <!-- Certificate of Achievement -->
  <text x="421" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#78350F" letter-spacing="2">Certificate of</text>
  <text x="421" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#78350F" letter-spacing="2">Achievement</text>

  <rect x="221" y="366" width="400" height="2" rx="1" fill="#FCD34D" opacity="0.4"/>

  <!-- Body text -->
  <text x="421" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#92400E" opacity="0.75">This certifies that</text>

  <!-- Name line -->
  <rect x="171" y="480" width="500" height="2" rx="1" fill="#B45309" opacity="0.4"/>
  <text x="421" y="474" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#78350F">[Child&#x2019;s Name]</text>

  <text x="421" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#92400E" opacity="0.75">has successfully completed the</text>
  <text x="421" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#B45309">#LittleBibleChallenge</text>
  <text x="421" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#92400E" opacity="0.75">7 days of reading God&#x2019;s Word together as a family.</text>

  <!-- Scripture quote -->
  <rect x="91" y="668" width="660" height="2" rx="1" fill="#FDE68A" opacity="0.35"/>
  <text x="421" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#78350F" opacity="0.7">&#x201C;Train up a child in the way he should go; even when he is old</text>
  <text x="421" y="756" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#78350F" opacity="0.7">he will not depart from it.&#x201D; &#x2014; Proverbs 22:6</text>
  <rect x="91" y="780" width="660" height="2" rx="1" fill="#FDE68A" opacity="0.35"/>

  <!-- Lumi tree of life (large, bottom centre) -->
  <svg x="241" y="790" width="360" height="320" viewBox="0 0 80 96" fill="none">
    <ellipse cx="40" cy="60" rx="38" ry="36" fill="#FCD34D" opacity="0.15"/>
    <ellipse cx="40" cy="60" rx="30" ry="28" fill="#FDE68A" opacity="0.18"/>
    <rect x="36" y="44" width="8" height="44" rx="4" fill="#92400E"/>
    <circle cx="40" cy="28" r="22" fill="#34D399"/>
    <circle cx="40" cy="24" r="18" fill="#4ADE80"/>
    <circle cx="28" cy="30" r="12" fill="#6EE7B7"/>
    <circle cx="52" cy="30" r="12" fill="#4ADE80"/>
    <circle cx="40" cy="14" r="12" fill="#6EE7B7"/>
    <circle cx="30" cy="22" r="4" fill="#F87171"/>
    <circle cx="50" cy="20" r="4" fill="#FCA5A5"/>
    <circle cx="40" cy="34" r="4" fill="#F87171"/>
    <circle cx="24" cy="34" r="3" fill="#FCD34D"/>
    <circle cx="56" cy="32" r="3" fill="#FCD34D"/>
    <circle cx="34" cy="55" r="2.5" fill="#78350F"/>
    <circle cx="46" cy="55" r="2.5" fill="#78350F"/>
    <circle cx="34.6" cy="54.4" r="0.8" fill="white"/>
    <circle cx="46.6" cy="54.4" r="0.8" fill="white"/>
    <path d="M32 63 Q40 69 48 63" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="8"  cy="28" r="2.2" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="72" cy="24" r="1.8" fill="#FEF3C7" opacity="0.8"/>
  </svg>

  <!-- Footer -->
  <text x="421" y="1130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#B45309" opacity="0.5">littlebible.org</text>
</svg>
