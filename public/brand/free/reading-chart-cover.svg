<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0C4A6E"/>
      <stop offset="50%"  stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#rc-bg)"/>

  <!-- Reading chart visual — 5×6 grid of checkbox tiles -->
  <g transform="translate(80, 120)">
    <!-- Row 1 -->
    <rect x="0"   y="0"   width="76" height="76" rx="12" fill="white" opacity="0.95"/>
    <text x="38" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#0369A1" font-weight="bold">1</text>
    <rect x="90"  y="0"   width="76" height="76" rx="12" fill="white" opacity="0.95"/>
    <text x="128" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#0369A1" font-weight="bold">2</text>
    <rect x="180" y="0"   width="76" height="76" rx="12" fill="white" opacity="0.95"/>
    <text x="218" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#0369A1" font-weight="bold">3</text>
    <rect x="270" y="0"   width="76" height="76" rx="12" fill="white" opacity="0.95"/>
    <text x="308" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#0369A1" font-weight="bold">4</text>
    <rect x="360" y="0"   width="76" height="76" rx="12" fill="white" opacity="0.95"/>
    <text x="398" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#0369A1" font-weight="bold">5</text>
    <!-- Row 2 — some ticked -->
    <rect x="0"   y="90"  width="76" height="76" rx="12" fill="#F59E0B" opacity="0.95"/>
    <text x="38" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" fill="white" font-weight="bold">✓</text>
    <rect x="90"  y="90"  width="76" height="76" rx="12" fill="#F59E0B" opacity="0.9"/>
    <text x="128" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" fill="white" font-weight="bold">✓</text>
    <rect x="180" y="90"  width="76" height="76" rx="12" fill="#F59E0B" opacity="0.85"/>
    <text x="218" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" fill="white" font-weight="bold">✓</text>
    <rect x="270" y="90"  width="76" height="76" rx="12" fill="#F59E0B" opacity="0.85"/>
    <text x="308" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" fill="white" font-weight="bold">✓</text>
    <rect x="360" y="90"  width="76" height="76" rx="12" fill="#F59E0B" opacity="0.8"/>
    <text x="398" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" fill="white" font-weight="bold">✓</text>
    <!-- Row 3 -->
    <rect x="0"   y="180" width="76" height="76" rx="12" fill="white" opacity="0.2"/>
    <text x="38" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="white" opacity="0.7">13</text>
    <rect x="90"  y="180" width="76" height="76" rx="12" fill="white" opacity="0.2"/>
    <text x="128" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="white" opacity="0.7">14</text>
    <rect x="180" y="180" width="76" height="76" rx="12" fill="white" opacity="0.2"/>
    <text x="218" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="white" opacity="0.7">15</text>
    <!-- Star at day 7 milestone (second row, col 2) -->
    <circle cx="128" cy="90" r="20" fill="#FCD34D" opacity="0.9"/>
    <text x="128" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">&#x2B50;</text>
  </g>

  <!-- Right panel -->
  <text x="640" y="180" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#7DD3FC" opacity="0.8" letter-spacing="3">FREE RESOURCE</text>
  <text x="640" y="275" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">30-Day Bible</text>
  <text x="640" y="358" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">Reading</text>
  <text x="640" y="441" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">Chart</text>
  <text x="640" y="506" font-family="Georgia, serif" font-size="34" fill="#7DD3FC" opacity="0.8">Family Bible Reading Tracker</text>
  <text x="640" y="556" font-family="system-ui, sans-serif" font-size="28" fill="white" opacity="0.5">littlebible.org/free</text>

  <!-- Lumi sapling (slightly bigger for this one) -->
  <svg x="1020" y="400" width="160" height="192" viewBox="0 0 80 96" fill="none">
    <ellipse cx="40" cy="68" rx="34" ry="28" fill="#FCD34D" opacity="0.22"/>
    <rect x="37.5" y="22" width="5" height="38" rx="2.5" fill="#34D399"/>
    <path d="M40 50 Q18 42 18 28 Q36 28 40 50Z" fill="#4ADE80"/>
    <path d="M40 56 Q62 48 62 34 Q44 34 40 56Z" fill="#34D399"/>
    <path d="M40 36 Q24 26 26 14 Q40 16 40 36Z" fill="#6EE7B7"/>
    <circle cx="26" cy="13" r="4" fill="#FCD34D"/>
    <ellipse cx="40" cy="76" rx="18" ry="19" fill="#FBBF24"/>
    <ellipse cx="40" cy="70" rx="18" ry="13" fill="#F59E0B"/>
    <circle cx="33.5" cy="73" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="73" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="72.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="72.2" r="0.9" fill="white"/>
    <path d="M32 81 Q40 88 48 81" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </svg>
</svg>
