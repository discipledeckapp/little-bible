<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="mv-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#064E3B"/>
      <stop offset="50%"  stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mv-bg)"/>

  <!-- Floating cards (3 illustrated verse cards) -->
  <!-- Card 1 - slight left tilt -->
  <g transform="rotate(-8, 280, 315)">
    <rect x="160" y="170" width="240" height="300" rx="16" fill="white" opacity="0.95"/>
    <rect x="160" y="170" width="240" height="60"  rx="16" fill="#0F766E"/>
    <rect x="160" y="210" width="240" height="20"  fill="#0F766E"/>
    <text x="280" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="white">Psalm 139:14</text>
    <text x="280" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#0F766E">&#x201C;I am fearfully</text>
    <text x="280" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#0F766E">and wonderfully</text>
    <text x="280" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#0F766E">made.&#x201D;</text>
    <text x="280" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0F766E" opacity="0.6">January &#x2022; Identity</text>
    <circle cx="280" cy="460" r="18" fill="#34D399" opacity="0.2"/>
    <text x="280" y="467" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">&#x1F30D;</text>
  </g>

  <!-- Card 2 - straight -->
  <g transform="rotate(0, 500, 315)">
    <rect x="380" y="150" width="240" height="300" rx="16" fill="white"/>
    <rect x="380" y="150" width="240" height="60"  rx="16" fill="#7C2D12"/>
    <rect x="380" y="190" width="240" height="20"  fill="#7C2D12"/>
    <text x="500" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="white">John 3:16</text>
    <text x="500" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#78350F">&#x201C;For God so</text>
    <text x="500" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#78350F">loved the</text>
    <text x="500" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#78350F">world...&#x201D;</text>
    <text x="500" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#78350F" opacity="0.6">February &#x2022; God&#x2019;s Love</text>
    <circle cx="500" cy="440" r="18" fill="#F87171" opacity="0.2"/>
    <text x="500" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">&#x2764;&#xFE0F;</text>
  </g>

  <!-- Card 3 - slight right tilt -->
  <g transform="rotate(7, 720, 315)">
    <rect x="600" y="180" width="240" height="300" rx="16" fill="white" opacity="0.9"/>
    <rect x="600" y="180" width="240" height="60"  rx="16" fill="#4338CA"/>
    <rect x="600" y="220" width="240" height="20"  fill="#4338CA"/>
    <text x="720" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="white">Proverbs 3:5</text>
    <text x="720" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#4338CA">&#x201C;Trust in the</text>
    <text x="720" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#4338CA">Lord with all</text>
    <text x="720" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#4338CA">your heart.&#x201D;</text>
    <text x="720" y="446" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4338CA" opacity="0.6">May &#x2022; Trust</text>
    <circle cx="720" cy="462" r="18" fill="#818CF8" opacity="0.2"/>
    <text x="720" y="469" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">&#x1F324;&#xFE0F;</text>
  </g>

  <!-- Right text -->
  <text x="950" y="190" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#6EE7B7" opacity="0.8" letter-spacing="3">FREE RESOURCE</text>
  <text x="950" y="290" font-family="Georgia, serif" font-size="74" font-weight="bold" fill="white" letter-spacing="-1">Memory</text>
  <text x="950" y="372" font-family="Georgia, serif" font-size="74" font-weight="bold" fill="white" letter-spacing="-1">Verse</text>
  <text x="950" y="454" font-family="Georgia, serif" font-size="74" font-weight="bold" fill="white" letter-spacing="-1">Cards</text>
  <text x="950" y="516" font-family="Georgia, serif" font-size="34" fill="#6EE7B7" opacity="0.8">12 key verses, one per month</text>
  <text x="950" y="560" font-family="system-ui, sans-serif" font-size="28" fill="white" opacity="0.5">littlebible.org/free</text>

  <!-- Lumi with sparkle -->
  <svg x="860" y="430" width="160" height="160" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="48" rx="30" ry="28" fill="#FCD34D" opacity="0.22"/>
    <ellipse cx="40" cy="50" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="44" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 26 Q28 14 33 5 Q47 9 40 26Z" fill="#34D399"/>
    <circle cx="33.5" cy="46" r="2.5" fill="#78350F"/>
    <circle cx="46.5" cy="46" r="2.5" fill="#78350F"/>
    <circle cx="34.2" cy="45.3" r="0.8" fill="white"/>
    <circle cx="47.2" cy="45.3" r="0.8" fill="white"/>
    <path d="M34 54 Q40 59 46 54" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="38" r="2" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="57" cy="36" r="1.5" fill="#FEF3C7" opacity="0.8"/>
  </svg>
</svg>
