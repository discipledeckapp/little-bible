<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="40%"  stop-color="#4C1D95"/>
      <stop offset="80%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pg-bg)"/>

  <!-- Gentle prayer glow — centred left -->
  <ellipse cx="360" cy="315" rx="280" ry="280" fill="#FCD34D" opacity="0.08"/>
  <ellipse cx="360" cy="315" rx="200" ry="200" fill="#FDE68A" opacity="0.06"/>

  <!-- Large Lumi praying — left half, centred -->
  <svg x="60" y="40" width="560" height="550" viewBox="0 0 80 96" fill="none">
    <!-- Prayer glow -->
    <ellipse cx="40" cy="55" rx="36" ry="34" fill="#7C3AED" opacity="0.12"/>
    <ellipse cx="40" cy="60" rx="30" ry="28" fill="#FCD34D" opacity="0.22"/>
    <ellipse cx="40" cy="60" rx="22" ry="20" fill="#FDE68A" opacity="0.28"/>
    <!-- Rays upward -->
    <path d="M40 34 L34 4"  stroke="#FCD34D" stroke-width="2"   stroke-linecap="round" opacity="0.7"/>
    <path d="M40 32 L40 2"  stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M40 34 L46 4"  stroke="#FCD34D" stroke-width="2"   stroke-linecap="round" opacity="0.7"/>
    <path d="M40 36 L54 10" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 36 L26 10" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Cross at top -->
    <rect x="39" y="0"  width="2"   height="9" rx="1"   fill="#DDD6FE" opacity="0.95"/>
    <rect x="36" y="3"  width="8"   height="2" rx="1"   fill="#DDD6FE" opacity="0.95"/>
    <!-- Body -->
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <!-- Leaf: bowed -->
    <path d="M40 34 Q32 26 36 18 Q44 22 40 34Z" fill="#34D399"/>
    <!-- Closed eyes (prayer) -->
    <path d="M30.5 57.5 Q33.5 60 36.5 57.5" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M43.5 57.5 Q46.5 60 49.5 57.5" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Peaceful smile -->
    <path d="M34.5 67 Q40 71 45.5 67" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Sparkles -->
    <circle cx="22" cy="52" r="2.4" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="59" cy="48" r="1.8" fill="#FEF3C7" opacity="0.7"/>
    <circle cx="15" cy="66" r="1.4" fill="#FEF3C7" opacity="0.6"/>
    <!-- Heart -->
    <path d="M62 62 Q63 60 64.5 62 Q66 60 67 62 Q66 65 64.5 67 Q63 65 62 62Z" fill="#F87171" opacity="0.8"/>
  </svg>

  <!-- Right panel -->
  <text x="660" y="165" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#C4B5FD" opacity="0.8" letter-spacing="3">FREE RESOURCE</text>
  <text x="660" y="265" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">Children&#x2019;s</text>
  <text x="660" y="348" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">Prayer</text>
  <text x="660" y="431" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="white" letter-spacing="-1">Guide</text>
  <text x="660" y="500" font-family="Georgia, serif" font-size="34" fill="#C4B5FD" opacity="0.85">Teaching Your Child to Pray</text>
  <text x="660" y="544" font-family="Georgia, serif" font-size="30" fill="#C4B5FD" opacity="0.7">in 7 Simple Steps</text>
  <text x="660" y="594" font-family="system-ui, sans-serif" font-size="28" fill="white" opacity="0.45">littlebible.org/free</text>
</svg>
