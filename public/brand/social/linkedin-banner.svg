  <rect x="490" y="36" width="2" height="119" rx="1" fill="#FDE68A" opacity="0.3"/>

  <!-- Tagline centre -->
  <text x="520" y="85"  font-family="Georgia, serif" font-size="36" fill="white" opacity="0.9">God&#x2019;s Word for Little Hearts</text>
  <text x="520" y="135" font-family="system-ui, sans-serif" font-size="30" fill="#FDE68A" opacity="0.65">All 66 books of Scripture &#x2022; Adapted for children ages 4&#x2013;7 &#x2022; Free, always</text>

