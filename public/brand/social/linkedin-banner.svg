  <rect x="974" y="50"  width="120" height="42" rx="21" fill="white" opacity="0.12"/>
  <text x="1034" y="79" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">66 Books</text>

