<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" fill="none">
  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="1128" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#78350F"/>
      <stop offset="60%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1128" height="191" fill="url(#li-bg)"/>
  <!-- Subtle pattern lines -->
  <rect x="0" y="63"  width="1128" height="1.5" fill="#FDE68A" opacity="0.08"/>
  <rect x="0" y="127" width="1128" height="1.5" fill="#FDE68A" opacity="0.06"/>

  <!-- Logo: icon + wordmark left -->
