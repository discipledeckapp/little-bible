    <defs>
      <linearGradient id="li-icon" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#7C2D12"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="9" fill="url(#li-icon)"/>
    <rect x="17.25" y="3" width="1.5" height="10" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <rect x="13" y="6.5" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <path d="M7 14.5 L17 13.5 L17 28 L7 27 Q6 27 6 26 L6 15.5 Q6 14.5 7 14.5Z" fill="rgba(255,255,255,0.96)"/>
    <path d="M29 14.5 L19 13.5 L19 28 L29 27 Q30 27 30 26 L30 15.5 Q30 14.5 29 14.5Z" fill="rgba(255,255,255,0.76)"/>
    <rect x="17" y="13.5" width="2" height="14.5" fill="rgba(120,53,15,0.22)"/>
    <rect x="8" y="16.5" width="7" height="1.2" rx="0.6" fill="rgba(120,53,15,0.28)"/>
    <rect x="8" y="19.5" width="8" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="16.5" width="6.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="19.5" width="7.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.15)"/>
  </svg>
  <text x="174" y="106" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="white" letter-spacing="-1">Little Bible</text>

