  <text x="474" y="305" font-family="Georgia, serif" font-size="60"  fill="#FDE68A" opacity="0.85">God&#x2019;s Word for Little Hearts</text>
  <text x="474" y="385" font-family="system-ui, sans-serif" font-size="46" fill="white" opacity="0.55">littlebible.org  &#x2022;  Free, always  &#x2022;  Ages 4&#x2013;7</text>

