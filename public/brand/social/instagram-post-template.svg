  <rect x="0"    y="1000" width="5"  height="80" fill="#FDE68A" opacity="0.5"/>
  <rect x="1000" y="1075" width="80" height="5"  fill="#FDE68A" opacity="0.5"/>
  <rect x="1075" y="1000" width="5"  height="80" fill="#FDE68A" opacity="0.5"/>

  <!-- Top-right: logo mark + handle -->
  <svg x="940" y="36" width="96" height="96" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="post-icon-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#7C2D12"/>
        <stop offset="55%"  stop-color="#B45309"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="9" fill="url(#post-icon-bg)"/>
    <rect x="17.25" y="3" width="1.5" height="10" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <rect x="13" y="6.5" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <path d="M7 14.5 L17 13.5 L17 28 L7 27 Q6 27 6 26 L6 15.5 Q6 14.5 7 14.5Z" fill="rgba(255,255,255,0.96)"/>
    <path d="M29 14.5 L19 13.5 L19 28 L29 27 Q30 27 30 26 L30 15.5 Q30 14.5 29 14.5Z" fill="rgba(255,255,255,0.76)"/>
    <rect x="17" y="13.5" width="2" height="14.5" fill="rgba(120,53,15,0.22)"/>
    <rect x="8" y="16.5" width="7" height="1.2" rx="0.6" fill="rgba(120,53,15,0.28)"/>
    <rect x="8" y="19.5" width="8" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="16.5" width="6.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
    <rect x="21" y="19.5" width="7.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.15)"/>
  </svg>
  <text x="932" y="154" text-anchor="end" font-family="system-ui, sans-serif" font-size="34" fill="#B45309" opacity="0.7">@littlebible</text>

  <!-- Verse reference chip — top left -->
  <rect x="44" y="44" width="280" height="56" rx="28" fill="#FDE68A" opacity="0.35"/>
  <text x="60" y="79" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#78350F">&#x1F4D6; Bible Verse</text>

  <!-- Verse text area (centred) -->
  <text x="540" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-style="italic" fill="#78350F" opacity="0.95">&#x201C;Your word is a lamp for</text>
  <text x="540" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-style="italic" fill="#78350F" opacity="0.95">my feet, a light on my</text>
  <text x="540" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-style="italic" fill="#78350F" opacity="0.95">path.&#x201D;</text>
  <!-- Reference -->
  <text x="540" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#B45309">Psalm 119:105</text>

  <!-- Decorative amber line -->
  <rect x="340" y="660" width="400" height="3" rx="1.5" fill="#FDE68A" opacity="0.6"/>

  <!-- Lumi seed — bottom left, peeking up -->
  <svg x="-20" y="780" width="320" height="384" viewBox="0 0 80 96" fill="none">
    <ellipse cx="40" cy="60" rx="32" ry="30" fill="#FCD34D" opacity="0.18"/>
    <ellipse cx="40" cy="60" rx="24" ry="22" fill="#FDE68A" opacity="0.22"/>
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <path d="M40 34 Q30 22 34 14 Q46 18 40 34Z" fill="#34D399"/>
    <circle cx="33.5" cy="58" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="58" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="57.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="57.2" r="0.9" fill="white"/>
    <path d="M34 67 Q40 72 46 67" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="26" cy="50" r="2.2" fill="#FEF3C7" opacity="0.85"/>
    <circle cx="55" cy="48" r="1.6" fill="#FEF3C7" opacity="0.75"/>
  </svg>

  <!-- Bottom URL + hashtag -->
  <text x="370" y="1020" font-family="system-ui, sans-serif" font-size="36" fill="#B45309" opacity="0.65">littlebible.org</text>
  <text x="370" y="1058" font-family="system-ui, sans-serif" font-size="34" fill="#92400E" opacity="0.5">#LittleBible  #BibleForKids  #ChristianParenting</text>
