<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" fill="none">
  <!-- Warm cream background -->
  <rect width="1080" height="1080" fill="#FFFBF5"/>
  <!-- Subtle corner decorations -->
  <rect x="0"    y="0"    width="80" height="5"  fill="#FDE68A" opacity="0.5"/>
  <rect x="0"    y="0"    width="5"  height="80" fill="#FDE68A" opacity="0.5"/>
  <rect x="1000" y="0"    width="80" height="5"  fill="#FDE68A" opacity="0.5"/>
  <rect x="1075" y="0"    width="5"  height="80" fill="#FDE68A" opacity="0.5"/>
