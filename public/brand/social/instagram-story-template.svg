<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="story-bg" x1="0" y1="0" x2="0" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1C0A00"/>
      <stop offset="40%"  stop-color="#7C2D12"/>
      <stop offset="75%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#story-bg)"/>

  <!-- Subtle lines pattern -->
  <rect x="0" y="400" width="1080" height="2" fill="#FDE68A" opacity="0.08"/>
  <rect x="0" y="800" width="1080" height="2" fill="#FDE68A" opacity="0.06"/>
  <rect x="0" y="1200" width="1080" height="2" fill="#FDE68A" opacity="0.08"/>
  <rect x="0" y="1600" width="1080" height="2" fill="#FDE68A" opacity="0.06"/>

  <!-- Top section: Logo + headline -->
  <svg x="490" y="80" width="100" height="100" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="story-icon-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#7C2D12"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="9" fill="url(#story-icon-bg)"/>
    <rect x="17.25" y="3" width="1.5" height="10" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <rect x="13" y="6.5" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <path d="M7 14.5 L17 13.5 L17 28 L7 27 Q6 27 6 26 L6 15.5 Q6 14.5 7 14.5Z" fill="rgba(255,255,255,0.96)"/>
    <path d="M29 14.5 L19 13.5 L19 28 L29 27 Q30 27 30 26 L30 15.5 Q30 14.5 29 14.5Z" fill="rgba(255,255,255,0.76)"/>
    <rect x="17" y="13.5" width="2" height="14.5" fill="rgba(120,53,15,0.22)"/>
    <rect x="8" y="16.5" width="7" height="1.2" rx="0.6" fill="rgba(120,53,15,0.28)"/>
    <rect x="21" y="16.5" width="6.5" height="1.2" rx="0.6" fill="rgba(120,53,15,0.20)"/>
  </svg>
  <text x="540" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="90" font-weight="bold" fill="white" opacity="0.95">Little Bible</text>

  <!-- Headline area -->
  <text x="540" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="68" font-style="italic" fill="#FDE68A" opacity="0.9">God&#x2019;s Word</text>
  <text x="540" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="68" font-style="italic" fill="#FDE68A" opacity="0.9">for Little Hearts</text>

  <!-- Decorative line -->
  <rect x="340" y="510" width="400" height="3" rx="1.5" fill="#FDE68A" opacity="0.35"/>

  <!-- Large Lumi (waving) — centre of story -->
  <svg x="140" y="580" width="800" height="960" viewBox="0 0 80 96" fill="none">
    <!-- Glow -->
    <ellipse cx="40" cy="60" rx="38" ry="36" fill="#FCD34D" opacity="0.25"/>
    <ellipse cx="40" cy="60" rx="30" ry="28" fill="#FDE68A" opacity="0.30"/>
    <!-- Body -->
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <!-- Leaf -->
    <path d="M40 34 Q27 23 30 13 Q44 16 40 34Z" fill="#34D399"/>
    <!-- Wave arm -->
    <path d="M58 60 Q68 52 70 44 Q71 40 69 39 Q67 38 65 41 Q68 38 66 36 Q64 34 62 38 Q64 35 62 33 Q60 31 58 35 Q56 50 58 60Z" fill="#FBBF24"/>
    <ellipse cx="66" cy="39" rx="4.5" ry="5" fill="#F59E0B"/>
    <!-- Eyes -->
    <circle cx="33.5" cy="58" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="58" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="57.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="57.2" r="0.9" fill="white"/>
    <!-- Smile -->
    <path d="M33 67 Q40 73.5 47 67" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Sparkles -->
    <circle cx="20" cy="50" r="2.5" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="60" cy="46" r="2"   fill="#FEF3C7" opacity="0.8"/>
    <circle cx="14" cy="66" r="1.6" fill="#FEF3C7" opacity="0.7"/>
    <circle cx="66" cy="64" r="1.4" fill="#FEF3C7" opacity="0.65"/>
  </svg>

  <!-- Bottom CTA -->
  <!-- CTA button shape -->
  <rect x="240" y="1680" width="600" height="110" rx="55" fill="white" opacity="0.15"/>
  <text x="540" y="1748" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="bold" fill="white">Read Free &#x2192;</text>

  <text x="540" y="1840" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" fill="white" opacity="0.6">littlebible.org</text>
  <text x="540" y="1895" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" fill="#FDE68A" opacity="0.5">#LittleBibleChallenge</text>
</svg>
