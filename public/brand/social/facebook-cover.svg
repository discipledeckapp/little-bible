<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" fill="none">
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="1640" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C2D12"/>
      <stop offset="50%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#fb-bg)"/>
  <!-- Divider line -->
  <rect x="760" y="60" width="3" height="504" rx="1.5" fill="#FDE68A" opacity="0.25"/>

  <!-- Left: Lumi (large, celebrating) with small child silhouette -->
  <!-- Lumi -->
  <svg x="60" y="40" width="460" height="552" viewBox="0 0 80 96" fill="none">
    <ellipse cx="40" cy="58" rx="38" ry="36" fill="#FCD34D" opacity="0.22"/>
    <ellipse cx="40" cy="58" rx="30" ry="28" fill="#FDE68A" opacity="0.28"/>
    <!-- Confetti -->
    <rect x="12" y="8"  width="4"   height="6"   rx="1" fill="#F87171" opacity="0.85" transform="rotate(-25 14 11)"/>
    <rect x="62" y="12" width="4"   height="6"   rx="1" fill="#60A5FA" opacity="0.85" transform="rotate(20 64 15)"/>
    <rect x="18" y="22" width="3.5" height="5.5" rx="1" fill="#34D399" opacity="0.8"  transform="rotate(40 20 25)"/>
    <rect x="57" y="6"  width="3.5" height="5.5" rx="1" fill="#A78BFA" opacity="0.8"  transform="rotate(-15 59 9)"/>
    <!-- Body -->
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <path d="M40 33 Q28 19 33 9 Q49 13 40 33Z" fill="#34D399"/>
    <!-- Celebrating eyes -->
    <path d="M30 56 Q33.5 52 37 56" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M43 56 Q46.5 52 50 56" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M31 65 Q40 76 49 65" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="50" r="2.4" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="58" cy="46" r="1.8" fill="#FEF3C7" opacity="0.8"/>
  </svg>

  <!-- Small child silhouette next to Lumi -->
  <ellipse cx="620" cy="330" rx="42" ry="42" fill="#FDE68A" opacity="0.25"/>
  <ellipse cx="620" cy="212" rx="38" ry="38" fill="white" opacity="0.18"/>
  <rect    x="582" y="250" width="76" height="120" rx="20" fill="white" opacity="0.15"/>
  <rect    x="560" y="370" width="36" height="90"  rx="10" fill="white" opacity="0.12"/>
  <rect    x="626" y="370" width="36" height="90"  rx="10" fill="white" opacity="0.12"/>

  <!-- Right: Title + info -->
  <!-- Logo mark small -->
  <svg x="800" y="80" width="80" height="80" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="fb-icon" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#7C2D12"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="9" fill="url(#fb-icon)"/>
    <rect x="17.25" y="3" width="1.5" height="10" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <rect x="13" y="6.5" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.92"/>
    <path d="M7 14.5 L17 13.5 L17 28 L7 27 Q6 27 6 26 L6 15.5 Q6 14.5 7 14.5Z" fill="rgba(255,255,255,0.96)"/>
    <path d="M29 14.5 L19 13.5 L19 28 L29 27 Q30 27 30 26 L30 15.5 Q30 14.5 29 14.5Z" fill="rgba(255,255,255,0.76)"/>
    <rect x="17" y="13.5" width="2" height="14.5" fill="rgba(120,53,15,0.22)"/>
  </svg>

  <text x="900" y="156" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="white" opacity="0.55">Little Bible</text>
  <text x="800" y="260" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="white" letter-spacing="-1">God&#x2019;s Word</text>
  <text x="800" y="370" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="white" letter-spacing="-1">for Little Hearts</text>

  <!-- Three category chips -->
  <rect x="800" y="410" width="220" height="64" rx="32" fill="white" opacity="0.14"/>
  <text x="910" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="white">&#x1F4D6; Stories</text>

  <rect x="1040" y="410" width="240" height="64" rx="32" fill="white" opacity="0.14"/>
  <text x="1160" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="white">&#x1F33F; Journeys</text>

  <rect x="1300" y="410" width="220" height="64" rx="32" fill="white" opacity="0.14"/>
  <text x="1410" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="white">&#x2728; Topics</text>

  <text x="800" y="558" font-family="system-ui, sans-serif" font-size="38" fill="white" opacity="0.55">littlebible.org  &#x2022;  Free, always</text>
</svg>
