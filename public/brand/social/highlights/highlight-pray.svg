<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#hp-bg)"/>
  <circle cx="200" cy="200" r="194" fill="none" stroke="#DDD6FE" stroke-width="4" opacity="0.3"/>
  <!-- Lumi praying -->
  <svg x="60" y="20" width="280" height="310" viewBox="0 0 80 96" fill="none">
    <!-- Prayer glow -->
    <ellipse cx="40" cy="55" rx="36" ry="34" fill="#7C3AED" opacity="0.1"/>
    <ellipse cx="40" cy="60" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <ellipse cx="40" cy="60" rx="22" ry="20" fill="#FDE68A" opacity="0.22"/>
    <!-- Rays upward -->
    <path d="M40 34 L36 8"  stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 32 L40 4"  stroke="#FDE68A" stroke-width="2"   stroke-linecap="round" opacity="0.8"/>
    <path d="M40 34 L44 8"  stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Cross -->
    <rect x="39.25" y="2" width="1.5" height="7" rx="0.75" fill="#DDD6FE" opacity="0.95"/>
    <rect x="36.5"  y="5" width="7"   height="1.5" rx="0.75" fill="#DDD6FE" opacity="0.95"/>
    <!-- Body -->
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <path d="M40 34 Q32 26 36 18 Q44 22 40 34Z" fill="#34D399"/>
    <!-- Closed eyes -->
    <path d="M30.5 57.5 Q33.5 60 36.5 57.5" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M43.5 57.5 Q46.5 60 49.5 57.5" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M34.5 67 Q40 71 45.5 67" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="54" r="2"   fill="#FEF3C7" opacity="0.7"/>
    <circle cx="57" cy="52" r="1.5" fill="#FEF3C7" opacity="0.6"/>
  </svg>
  <text x="200" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white">Pray</text>
  <text x="200" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#DDD6FE" opacity="0.75">Family prayer</text>
</svg>
