<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="tt-bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1C0A00"/>
      <stop offset="60%"  stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <clipPath id="tt-circle"><circle cx="400" cy="400" r="400"/></clipPath>
  </defs>
  <circle cx="400" cy="400" r="400" fill="url(#tt-bg)"/>

  <!-- Large Lumi (excited, waving) fills most of the circle -->
  <svg x="60" y="40" width="680" height="816" viewBox="0 0 80 96" fill="none">
    <ellipse cx="40" cy="58" rx="38" ry="36" fill="#FCD34D" opacity="0.28"/>
    <ellipse cx="40" cy="58" rx="30" ry="28" fill="#FDE68A" opacity="0.33"/>
    <!-- Confetti -->
    <rect x="8"  y="10" width="4"   height="6"   rx="1" fill="#F87171" opacity="0.8" transform="rotate(-20 10 13)"/>
    <rect x="65" y="8"  width="4"   height="6"   rx="1" fill="#60A5FA" opacity="0.8" transform="rotate(15 67 11)"/>
    <rect x="15" y="24" width="3.5" height="5.5" rx="1" fill="#34D399" opacity="0.75" transform="rotate(35 17 27)"/>
    <!-- Body -->
    <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
    <!-- Leaf -->
    <path d="M40 34 Q27 23 30 13 Q44 16 40 34Z" fill="#34D399"/>
    <!-- Wave arm -->
    <path d="M58 60 Q68 52 70 44 Q71 40 69 39 Q67 38 65 41 Q64 35 62 33 Q60 31 58 35 Q56 50 58 60Z" fill="#FBBF24"/>
    <ellipse cx="66" cy="39" rx="4.5" ry="5" fill="#F59E0B"/>
    <!-- Excited eyes (wide) -->
    <circle cx="33.5" cy="57" r="3.4" fill="#78350F"/>
    <circle cx="46.5" cy="57" r="3.4" fill="#78350F"/>
    <circle cx="34.5" cy="55.8" r="1.2" fill="white"/>
    <circle cx="47.5" cy="55.8" r="1.2" fill="white"/>
    <!-- Big smile -->
    <path d="M32 66 Q40 74 48 66" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Sparkles -->
    <circle cx="18" cy="48" r="2.8" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="62" cy="44" r="2.2" fill="#FEF3C7" opacity="0.85"/>
    <circle cx="12" cy="64" r="1.8" fill="#FEF3C7" opacity="0.75"/>
    <circle cx="68" cy="62" r="1.6" fill="#FEF3C7" opacity="0.7"/>
  </svg>

  <!-- Little Bible badge bottom -->
  <rect x="220" y="680" width="360" height="80" rx="40" fill="white" opacity="0.12"/>
  <text x="400" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="white">Little Bible</text>
</svg>
