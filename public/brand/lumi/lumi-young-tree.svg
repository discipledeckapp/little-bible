  <circle cx="34.5" cy="57" r="2.5" fill="#78350F"/>
  <circle cx="45.5" cy="57" r="2.5" fill="#78350F"/>
  <circle cx="35.1" cy="56.4" r="0.8" fill="white"/>
  <circle cx="46.1" cy="56.4" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M32.5 64 Q40 69.5 47.5 64" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Stars -->
  <circle cx="10" cy="36" r="2" fill="#FEF3C7" opacity="0.85"/>
  <circle cx="70" cy="32" r="1.6" fill="#FEF3C7" opacity="0.75"/>
  <!-- Stage label -->
  <text x="40" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#B45309" opacity="0.7">Growing Tree</text>
