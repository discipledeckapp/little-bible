<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" fill="none">
  <!-- Background -->
  <rect width="1200" height="1080" fill="#FFFBF5"/>

  <!-- Title -->
  <text x="600" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#78350F">Lumi — Expression Sheet</text>
  <text x="600" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#B45309" opacity="0.7">Little Bible Mascot · All 12 Expressions</text>
  <rect x="80" y="104" width="1040" height="2" rx="1" fill="#FCD34D" opacity="0.4"/>

  <!-- GRID: 4 columns × 3 rows, each cell 280×240, with 20px gap, starting at (40,120) -->
  <!-- Row 1 -->

  <!-- 1 — Happy -->
  <rect x="40"  y="116" width="270" height="260" rx="16" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="175" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#78350F">Happy</text>
  <svg x="65" y="130" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.22"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 28 Q28 16 33 8 Q47 12 40 28Z" fill="#34D399"/>
    <circle cx="33.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="47.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="47.2" r="0.9" fill="white"/>
    <path d="M33 57 Q40 63 47 57" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="33.5" cy="54" r="3.5" fill="#FBBF24" opacity="0.5"/>
    <circle cx="46.5" cy="54" r="3.5" fill="#FBBF24" opacity="0.5"/>
  </svg>

  <!-- 2 — Celebrating -->
  <rect x="330" y="116" width="270" height="260" rx="16" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="465" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#78350F">Celebrating</text>
  <svg x="355" y="130" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.22"/>
    <!-- Confetti -->
    <rect x="16" y="18" width="6" height="4" rx="1" fill="#F87171" transform="rotate(-20,16,18)"/>
    <rect x="58" y="16" width="5" height="4" rx="1" fill="#34D399" transform="rotate(15,58,16)"/>
    <rect x="10" y="38" width="5" height="3" rx="1" fill="#818CF8" transform="rotate(-10,10,38)"/>
    <rect x="64" y="36" width="5" height="3" rx="1" fill="#FBBF24" transform="rotate(12,64,36)"/>
    <rect x="28" y="12" width="4" height="4" rx="1" fill="#818CF8" transform="rotate(25,28,12)"/>
    <rect x="52" y="14" width="4" height="3" rx="1" fill="#F87171" transform="rotate(-15,52,14)"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 28 Q28 16 33 8 Q47 12 40 28Z" fill="#34D399"/>
    <!-- Crescent eyes (squint) -->
    <path d="M30 45 Q33.5 41 37 45" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M43 45 Q46.5 41 50 45" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M33 57 Q40 64 47 57" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="33.5" cy="54" r="3.5" fill="#FBBF24" opacity="0.5"/>
    <circle cx="46.5" cy="54" r="3.5" fill="#FBBF24" opacity="0.5"/>
  </svg>

  <!-- 3 — Praying -->
  <rect x="620" y="116" width="270" height="260" rx="16" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="755" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#5B21B6">Praying</text>
  <svg x="645" y="130" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <!-- Rays -->
    <path d="M40 30 L36 6"  stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 28 L40 4"  stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M40 30 L44 6"  stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 32 L52 12" stroke="#FCD34D" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 32 L28 12" stroke="#FCD34D" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 28 Q32 20 36 12 Q44 16 40 28Z" fill="#34D399"/>
    <path d="M30.5 47.5 Q33.5 50 36.5 47.5" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M43.5 47.5 Q46.5 50 49.5 47.5" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M34 56 Q40 61 46 56" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="44" r="2" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="57" cy="42" r="1.6" fill="#FEF3C7" opacity="0.7"/>
  </svg>

  <!-- 4 — Reading -->
  <rect x="910" y="116" width="270" height="260" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1045" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#065F46">Reading</text>
  <svg x="935" y="130" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <!-- Floating Bible -->
    <rect x="24" y="10" width="32" height="24" rx="4" fill="#7C2D12"/>
    <rect x="38" y="10" width="2" height="24" fill="rgba(0,0,0,0.2)"/>
    <rect x="38" y="10" width="1" height="24" fill="#FDE68A" opacity="0.5"/>
    <rect x="26" y="14" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.5"/>
    <rect x="26" y="18" width="9"  height="1.5" rx="0.75" fill="#FDE68A" opacity="0.4"/>
    <rect x="26" y="22" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.3"/>
    <rect x="41" y="14" width="10" height="1.5" rx="0.75" fill="#FDE68A" opacity="0.4"/>
    <rect x="41" y="18" width="9"  height="1.5" rx="0.75" fill="#FDE68A" opacity="0.35"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 32 Q28 20 33 12 Q47 16 40 32Z" fill="#34D399"/>
    <circle cx="33.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="47.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="47.2" r="0.9" fill="white"/>
    <path d="M34 56 Q40 60 46 56" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- Row 2 -->

  <!-- 5 — Wondering -->
  <rect x="40"  y="396" width="270" height="260" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="175" y="644" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1E40AF">Wondering</text>
  <svg x="65" y="410" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <!-- Question mark -->
    <text x="56" y="26" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#3B82F6" opacity="0.9">?</text>
    <circle cx="22" cy="30" r="3" fill="#BFDBFE" opacity="0.7"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 30 Q28 18 33 10 Q47 14 40 30Z" fill="#34D399"/>
    <!-- Wide open eyes -->
    <circle cx="33.5" cy="47" r="3.6" fill="#78350F"/>
    <circle cx="46.5" cy="47" r="3.6" fill="#78350F"/>
    <circle cx="34.5" cy="46" r="1.2" fill="white"/>
    <circle cx="47.5" cy="46" r="1.2" fill="white"/>
    <!-- Small O mouth -->
    <ellipse cx="40" cy="58" rx="3" ry="3.5" stroke="#78350F" stroke-width="1.8" fill="none"/>
  </svg>

  <!-- 6 — Sleepy -->
  <rect x="330" y="396" width="270" height="260" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="465" y="644" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#5B21B6">Sleepy</text>
  <svg x="355" y="410" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.16"/>
    <!-- ZZZ -->
    <text x="52" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#A78BFA" opacity="0.8">z</text>
    <text x="58" y="13" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#A78BFA" opacity="0.7">z</text>
    <text x="66" y="6"  font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#A78BFA" opacity="0.6">z</text>
    <!-- Slightly tilted leaf (droopy) -->
    <path d="M40 30 Q26 22 32 12 Q44 18 40 30Z" fill="#34D399" transform="rotate(-18,40,30)"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <!-- Half-closed eyes -->
    <path d="M30 46 Q33.5 44 37 46" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M43 46 Q46.5 44 50 46" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Neutral mouth -->
    <path d="M35 57 Q40 59 45 57" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- 7 — Excited -->
  <rect x="620" y="396" width="270" height="260" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="755" y="644" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#C2410C">Excited</text>
  <svg x="645" y="410" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.22"/>
    <!-- Sparkle stars -->
    <circle cx="16" cy="22" r="2.5" fill="#FCD34D" opacity="0.9"/>
    <circle cx="64" cy="18" r="2"   fill="#FCD34D" opacity="0.8"/>
    <circle cx="12" cy="44" r="1.8" fill="#FCD34D" opacity="0.7"/>
    <circle cx="68" cy="40" r="2.2" fill="#FCD34D" opacity="0.8"/>
    <path d="M16 12 L14 22 L24 20Z" fill="#FCD34D" opacity="0.5"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 28 Q28 16 33 8 Q47 12 40 28Z" fill="#34D399"/>
    <!-- Star eyes -->
    <text x="29" y="52" font-family="system-ui, sans-serif" font-size="12">★</text>
    <text x="42" y="52" font-family="system-ui, sans-serif" font-size="12">★</text>
    <!-- Big O smile -->
    <path d="M31 58 Q40 68 49 58" stroke="#78350F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="33.5" cy="56" r="3" fill="#FBBF24" opacity="0.6"/>
    <circle cx="46.5" cy="56" r="3" fill="#FBBF24" opacity="0.6"/>
  </svg>

  <!-- 8 — Sad -->
  <rect x="910" y="396" width="270" height="260" rx="16" fill="#EFF6FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="1045" y="644" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0C4A6E">Sad</text>
  <svg x="935" y="410" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.14"/>
    <!-- Drooping leaf -->
    <path d="M40 30 Q24 26 28 14 Q42 18 40 30Z" fill="#34D399" opacity="0.8" transform="rotate(-25,40,30)"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24" opacity="0.9"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B" opacity="0.9"/>
    <!-- Droopy eyes -->
    <path d="M30 48 Q33.5 46 37 48" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M43 48 Q46.5 46 50 48" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Tear drop -->
    <ellipse cx="34" cy="53" rx="1.5" ry="2.2" fill="#93C5FD" opacity="0.9"/>
    <!-- Frown mouth -->
    <path d="M33 60 Q40 55 47 60" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- Row 3 -->

  <!-- 9 — Waving -->
  <rect x="40"  y="676" width="270" height="260" rx="16" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="175" y="924" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#78350F">Waving</text>
  <svg x="65" y="690" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <!-- Arm -->
    <path d="M56 44 Q66 36 68 26 Q64 24 60 30 Q58 36 54 40Z" fill="#FBBF24"/>
    <ellipse cx="68" cy="22" rx="5" ry="5" fill="#FBBF24"/>
    <!-- Motion lines -->
    <path d="M72 16 L76 12" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M74 22 L78 20" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 28 Q28 16 33 8 Q47 12 40 28Z" fill="#34D399"/>
    <circle cx="33.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="46.5" cy="48" r="2.8" fill="#78350F"/>
    <circle cx="34.2" cy="47.2" r="0.9" fill="white"/>
    <circle cx="47.2" cy="47.2" r="0.9" fill="white"/>
    <path d="M33 57 Q40 63 47 57" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- 10 — Teaching -->
  <rect x="330" y="676" width="270" height="260" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="465" y="924" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#065F46">Teaching</text>
  <svg x="355" y="690" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
    <!-- Chalkboard -->
    <rect x="8" y="10" width="38" height="24" rx="3" fill="#16A34A"/>
    <rect x="8" y="10" width="38" height="3"  rx="2" fill="#15803D"/>
    <rect x="10" y="16" width="22" height="1.5" rx="0.75" fill="white" opacity="0.6"/>
    <rect x="10" y="20" width="18" height="1.5" rx="0.75" fill="white" opacity="0.5"/>
    <rect x="10" y="24" width="24" height="1.5" rx="0.75" fill="white" opacity="0.4"/>
    <!-- Pointer stick -->
    <path d="M44 12 L56 40" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    <circle cx="56" cy="40" r="2" fill="#78350F"/>
    <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
    <path d="M40 30 Q28 18 33 10 Q47 14 40 30Z" fill="#34D399"/>
    <!-- Squint arches (focused) -->
    <path d="M30 46 Q33.5 43 37 46" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M43 46 Q46.5 43 50 46" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M33.5 55 Q40 60 46.5 55" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- 11 — Flying -->
  <rect x="620" y="676" width="270" height="260" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="755" y="924" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#92400E">Flying</text>
  <svg x="645" y="690" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <!-- Sparkle trail -->
    <circle cx="12" cy="60" r="3"   fill="#FCD34D" opacity="0.7"/>
    <circle cx="8"  cy="52" r="2"   fill="#FCD34D" opacity="0.5"/>
    <circle cx="14" cy="44" r="1.5" fill="#FCD34D" opacity="0.4"/>
    <g transform="rotate(-12, 40, 50)">
      <ellipse cx="40" cy="50" rx="30" ry="28" fill="#FCD34D" opacity="0.18"/>
      <ellipse cx="40" cy="52" rx="18" ry="21" fill="#FBBF24"/>
      <ellipse cx="40" cy="46" rx="18" ry="13" fill="#F59E0B"/>
      <!-- Leaf rotated opposite so it appears upright in motion -->
      <path d="M48 24 Q64 16 62 6 Q50 10 48 24Z" fill="#34D399" transform="rotate(12,48,24)"/>
      <circle cx="33.5" cy="48" r="2.8" fill="#78350F"/>
      <circle cx="46.5" cy="48" r="2.8" fill="#78350F"/>
      <circle cx="34.2" cy="47.2" r="0.9" fill="white"/>
      <circle cx="47.2" cy="47.2" r="0.9" fill="white"/>
      <path d="M33 57 Q40 63 47 57" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </g>
  </svg>

  <!-- 12 — Growing (Seed → Sprout transition) -->
  <rect x="910" y="676" width="270" height="260" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="1045" y="924" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#065F46">Growing</text>
  <svg x="935" y="690" width="220" height="220" viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="56" rx="30" ry="26" fill="#FCD34D" opacity="0.18"/>
    <!-- Stem -->
    <rect x="38.5" y="24" width="3" height="22" rx="1.5" fill="#34D399"/>
    <!-- Two side leaves -->
    <path d="M40 38 Q22 32 22 20 Q38 20 40 38Z" fill="#4ADE80"/>
    <path d="M40 44 Q58 38 58 26 Q42 26 40 44Z" fill="#34D399"/>
    <!-- Top leaf / bud -->
    <path d="M40 26 Q32 16 36 8 Q44 12 40 26Z" fill="#6EE7B7"/>
    <!-- Tiny golden bud -->
    <circle cx="40" cy="7" r="3.5" fill="#FCD34D"/>
    <!-- Stars around (growth glow) -->
    <circle cx="16" cy="30" r="2" fill="#FCD34D" opacity="0.8"/>
    <circle cx="64" cy="28" r="1.6" fill="#FCD34D" opacity="0.7"/>
    <ellipse cx="40" cy="62" rx="16" ry="17" fill="#FBBF24"/>
    <ellipse cx="40" cy="57" rx="16" ry="11" fill="#F59E0B"/>
    <circle cx="34" cy="58" r="2.5" fill="#78350F"/>
    <circle cx="46" cy="58" r="2.5" fill="#78350F"/>
    <circle cx="34.6" cy="57.3" r="0.8" fill="white"/>
    <circle cx="46.6" cy="57.3" r="0.8" fill="white"/>
    <path d="M33 65 Q40 71 47 65" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- Expression labels row separators -->
  <rect x="80" y="384" width="1040" height="1" rx="0.5" fill="#FCD34D" opacity="0.25"/>
  <rect x="80" y="664" width="1040" height="1" rx="0.5" fill="#FCD34D" opacity="0.25"/>
  <rect x="80" y="944" width="1040" height="1" rx="0.5" fill="#FCD34D" opacity="0.25"/>

  <!-- Row labels (vertical, right side) -->
  <rect x="80" y="1000" width="1040" height="60" rx="12" fill="#FEF3C7" opacity="0.5"/>
  <text x="600" y="1036" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#B45309" opacity="0.8">
    Little Bible · Lumi Mascot · © 2026 · littlebible.org
  </text>
</svg>
