<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="480" height="576" fill="none">
  <rect width="80" height="96" fill="#FFFBF5"/>
  <!-- Extra large celebration glow -->
  <ellipse cx="40" cy="58" rx="38" ry="36" fill="#FCD34D" opacity="0.22"/>
  <ellipse cx="40" cy="58" rx="30" ry="28" fill="#FDE68A" opacity="0.28"/>
  <!-- Confetti -->
  <rect x="12" y="8"  width="4"   height="6"   rx="1" fill="#F87171" opacity="0.85" transform="rotate(-25 14 11)"/>
  <rect x="62" y="12" width="4"   height="6"   rx="1" fill="#60A5FA" opacity="0.85" transform="rotate(20 64 15)"/>
  <rect x="18" y="22" width="3.5" height="5.5" rx="1" fill="#34D399" opacity="0.8"  transform="rotate(40 20 25)"/>
  <rect x="57" y="6"  width="3.5" height="5.5" rx="1" fill="#A78BFA" opacity="0.8"  transform="rotate(-15 59 9)"/>
  <rect x="6"  y="36" width="3"   height="5"   rx="1" fill="#FCD34D" opacity="0.85" transform="rotate(30 8 39)"/>
  <rect x="70" y="30" width="3"   height="5"   rx="1" fill="#F87171" opacity="0.8"  transform="rotate(-40 72 33)"/>
  <rect x="30" y="4"  width="3"   height="5"   rx="1" fill="#60A5FA" opacity="0.75" transform="rotate(10 32 7)"/>
  <rect x="50" y="16" width="3"   height="4.5" rx="1" fill="#34D399" opacity="0.8"  transform="rotate(-30 52 19)"/>
  <!-- Star burst at top -->
  <circle cx="40" cy="14" r="6" fill="#FCD34D" opacity="0.25"/>
  <path d="M40 8 L41.5 13 L47 13 L42.5 16.5 L44 22 L40 18.5 L36 22 L37.5 16.5 L33 13 L38.5 13 Z" fill="#F59E0B" opacity="0.7"/>
  <!-- Seed body -->
  <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
  <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
  <!-- Leaf: upright, bouncy (slightly larger) -->
  <path d="M40 33 Q28 19 33 9 Q49 13 40 33Z" fill="#34D399"/>
  <path d="M40 33 Q36 20 38 10" stroke="#10B981" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Eyes: big happy crescent squint -->
  <path d="M30 56 Q33.5 52 37 56" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M43 56 Q46.5 52 50 56" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Huge smile / open-mouth laugh -->
  <path d="M31 65 Q40 76 49 65" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <ellipse cx="40" cy="70" rx="5.5" ry="3.5" fill="#78350F" opacity="0.15"/>
  <!-- Sparkles — extra -->
  <circle cx="22" cy="50" r="2.4" fill="#FEF3C7" opacity="0.9"/>
  <circle cx="58" cy="46" r="1.8" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="16" cy="62" r="1.6" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="63" cy="60" r="1.4" fill="#FEF3C7" opacity="0.7"/>
  <!-- Pose label -->
  <text x="40" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#B45309" opacity="0.7">Celebrating</text>
</svg>
