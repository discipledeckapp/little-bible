<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="480" height="576" fill="none">
  <rect width="80" height="96" fill="#FFFBF5"/>
  <!-- Glow -->
  <ellipse cx="40" cy="60" rx="32" ry="30" fill="#FCD34D" opacity="0.18"/>
  <ellipse cx="40" cy="60" rx="24" ry="22" fill="#FDE68A" opacity="0.22"/>
  <!-- Small scroll / chalkboard to the left -->
  <!-- Chalkboard frame -->
  <rect x="4" y="28" width="22" height="18" rx="2" fill="#2D6A4F"/>
  <rect x="5" y="29" width="20" height="16" rx="1" fill="#40916C"/>
  <!-- Chalkboard content: small cross + lines -->
  <rect x="14" y="30.5" width="0.8" height="4" rx="0.4" fill="white" opacity="0.8"/>
  <rect x="12.5" y="32" width="3.8" height="0.8" rx="0.4" fill="white" opacity="0.8"/>
  <rect x="7" y="36" width="8" height="0.7" rx="0.35" fill="white" opacity="0.6"/>
  <rect x="7" y="38" width="7" height="0.7" rx="0.35" fill="white" opacity="0.5"/>
  <rect x="7" y="40" width="6" height="0.7" rx="0.35" fill="white" opacity="0.4"/>
  <!-- Pointer / leaf-tip pointing at board -->
  <path d="M27 36 Q34 38 38 46" stroke="#92400E" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="27" cy="36" r="1.5" fill="#92400E" opacity="0.6"/>
  <!-- Seed body -->
  <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
  <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
  <!-- Leaf: upright, confident -->
  <path d="M40 34 Q30 22 34 14 Q46 18 40 34Z" fill="#34D399"/>
  <path d="M40 34 Q37 24 39 16" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Eyes: wise, slightly squinted upward (confident) -->
  <circle cx="33.5" cy="57.5" r="2.8" fill="#78350F"/>
  <circle cx="46.5" cy="57.5" r="2.8" fill="#78350F"/>
  <!-- Eye squint overlay — slight arch above each eye -->
  <path d="M30.7 55 Q33.5 53.5 36.3 55" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M43.7 55 Q46.5 53.5 49.3 55" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <circle cx="34.2" cy="57.2" r="0.9" fill="white"/>
  <circle cx="47.2" cy="57.2" r="0.9" fill="white"/>
  <!-- Knowing smile -->
  <path d="M34 66 Q40 71 46 66" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Stars / wisdom sparkles -->
  <circle cx="56" cy="44" r="2.2" fill="#FEF3C7" opacity="0.85"/>
  <circle cx="62" cy="52" r="1.6" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="57" cy="58" r="1.2" fill="#FEF3C7" opacity="0.6"/>
  <!-- Small stars near board -->
  <circle cx="2" cy="24" r="1.5" fill="#FEF3C7" opacity="0.7"/>
  <!-- Pose label -->
  <text x="40" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#B45309" opacity="0.7">Teaching</text>
</svg>
