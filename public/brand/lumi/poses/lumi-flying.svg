<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="480" height="576" fill="none">
  <rect width="80" height="96" fill="#FFFBF5"/>
  <!-- Wide flight glow -->
  <ellipse cx="42" cy="52" rx="36" ry="30" fill="#FCD34D" opacity="0.18"/>
  <ellipse cx="42" cy="52" rx="28" ry="22" fill="#FDE68A" opacity="0.22"/>
  <!-- Sparkle trail — left side (behind Lumi) -->
  <circle cx="8"  cy="72" r="3.5" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="14" cy="68" r="3"   fill="#FEF3C7" opacity="0.6"/>
  <circle cx="20" cy="64" r="2.5" fill="#FDE68A" opacity="0.55"/>
  <circle cx="26" cy="60" r="2"   fill="#FDE68A" opacity="0.5"/>
  <circle cx="30" cy="57" r="1.5" fill="#FCD34D" opacity="0.45"/>
  <!-- Motion lines -->
  <path d="M4  62 L10 62" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M2  68 L9  68" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M5  74 L12 74" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Lumi body — tilted slightly (rotate ~12 degrees) -->
  <g transform="rotate(-12, 44, 55)">
    <!-- Seed body -->
    <ellipse cx="44" cy="58" rx="20" ry="23" fill="#FBBF24"/>
    <ellipse cx="44" cy="51" rx="20" ry="16" fill="#F59E0B"/>
    <!-- Leaf — spinning like a propeller (rotated 40 degrees) -->
    <path d="M44 30 Q32 18 36 8 Q50 12 44 30Z" fill="#34D399" transform="rotate(40, 44, 20)"/>
    <!-- Eyes: excited, wide -->
    <circle cx="37.5" cy="54" r="3"   fill="#78350F"/>
    <circle cx="50.5" cy="54" r="3"   fill="#78350F"/>
    <circle cx="38.3" cy="53.1" r="1" fill="white"/>
    <circle cx="51.3" cy="53.1" r="1" fill="white"/>
    <!-- Joy smile -->
    <path d="M37 63 Q44 69 51 63" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Forward sparkles -->
  <circle cx="68" cy="42" r="2.2" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="74" cy="36" r="1.6" fill="#FEF3C7" opacity="0.65"/>
  <!-- Pose label -->
  <text x="40" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#B45309" opacity="0.7">Flying</text>
</svg>
