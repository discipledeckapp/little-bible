<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="480" height="576" fill="none">
  <rect width="80" height="96" fill="#FFFBF5"/>
  <!-- Glow -->
  <ellipse cx="40" cy="60" rx="32" ry="30" fill="#FCD34D" opacity="0.18"/>
  <ellipse cx="40" cy="60" rx="24" ry="22" fill="#FDE68A" opacity="0.22"/>
  <!-- Seed body -->
  <ellipse cx="40" cy="62" rx="20" ry="23" fill="#FBBF24"/>
  <ellipse cx="40" cy="55" rx="20" ry="16" fill="#F59E0B"/>
  <!-- Leaf: to the left side slightly (tilted toward wave) -->
  <path d="M40 34 Q27 23 30 13 Q44 16 40 34Z" fill="#34D399"/>
  <path d="M40 34 Q35 24 37 14" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Wave arm — right side -->
  <path d="M58 60 Q68 52 70 44 Q71 40 69 39 Q67 38 65 41 Q68 38 66 36 Q64 34 62 38 Q64 35 62 33 Q60 31 58 35 Q56 50 58 60Z" fill="#FBBF24"/>
  <!-- Wave hand (rounded bump) -->
  <ellipse cx="66" cy="39" rx="4.5" ry="5" fill="#F59E0B"/>
  <ellipse cx="63" cy="36" rx="2.5" ry="3" fill="#FBBF24"/>
  <!-- Eyes: happy, warm -->
  <circle cx="33.5" cy="58" r="2.8" fill="#78350F"/>
  <circle cx="46.5" cy="58" r="2.8" fill="#78350F"/>
  <circle cx="34.2" cy="57.2" r="0.9" fill="white"/>
  <circle cx="47.2" cy="57.2" r="0.9" fill="white"/>
  <!-- Big welcoming smile -->
  <path d="M33 67 Q40 73.5 47 67" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Motion lines from wave -->
  <path d="M70 36 L74 31" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M72 41 L77 38" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M71 46 L76 45" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Sparkles -->
  <circle cx="20" cy="50" r="2.2" fill="#FEF3C7" opacity="0.85"/>
  <circle cx="14" cy="63" r="1.4" fill="#FEF3C7" opacity="0.6"/>
  <!-- Pose label -->
  <text x="40" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#B45309" opacity="0.7">Waving</text>
</svg>
