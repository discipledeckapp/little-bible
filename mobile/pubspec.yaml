name: little_bible
description: "God's Word for Little Hearts — Bible stories, games, and verse memory for children."
publish_to: 'none'
version: 1.1.0+6

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # ── Local database (offline-first source of truth) ──────────────────────────
  drift: ^2.22.1
  # Bundles SQLite .so for Android (API 24+). iOS uses the system SQLite — no-op there.
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── TTS (free, offline, platform-native) ─────────────────────────────────────
  flutter_tts: ^4.2.1

  # ── Audio playback (pre-generated Edge TTS narration MP3s) ───────────────────
  audioplayers: ^6.1.0

  # ── Animations ───────────────────────────────────────────────────────────────
  rive: ^0.13.17
  flutter_animate: ^4.5.2

  # ── IAP (one-time unlock) ────────────────────────────────────────────────────
  in_app_purchase: ^3.2.0

  # ── Network (sync only — never in the read path) ────────────────────────────
  dio: ^5.7.0

  # ── Push notifications ───────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Background sync ──────────────────────────────────────────────────────────
  workmanager: ^0.9.1

  # ── Network connectivity ──────────────────────────────────────────────────────
  connectivity_plus: ^6.1.3

  # ── Auth (parent only) ─────────────────────────────────────────────────────
  # google_sign_in: ^6.2.2  — deferred until cloud sync sprint
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # ── Serialisation helpers ────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Sharing / saving paintings ─────────────────────────────────────────────
  share_plus: ^10.1.4

  # ── Utilities ────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code generation ──────────────────────────────────────────────────────────
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # ── Testing ──────────────────────────────────────────────────────────────────
  mocktail: ^1.0.4

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Icons are generated from the vector sources in assets/brand/*.svg.
# Never hand-edit the PNGs — edit the SVG, re-run tool/render_icons.mjs, then
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  # Deep brown, so the amber Lumi actually contrasts against it.
  adaptive_icon_background: "#7C2D12"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  remove_alpha_ios: true

